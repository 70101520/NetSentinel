name: netsentinel
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netsentinel}
      POSTGRES_USER: ${POSTGRES_USER:-netsentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [data]
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, allkeys-lru]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [data]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
  api:
    build: ./backend
    env_file: .env
    command: [sh, -c, 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000']
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [edge, data]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
  worker:
    build: ./backend
    env_file: .env
    command: [python, -m, app.worker]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [data]
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
  web-gateway:
    build: ./backend
    env_file: .env
    command: [python, -m, app.web_gateway]
    depends_on:
      postgres: {condition: service_healthy}
    ports: ['3128:3128']
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('localhost', 3128), 2).close()"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [edge, data]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1.0
  portal:
    build: ./frontend
    depends_on:
      api: {condition: service_healthy}
    ports: ['8080:8080']
    networks: [edge]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
networks:
  edge: {}
  data: {internal: true}
volumes:
  postgres-data: {}
  redis-data: {}
