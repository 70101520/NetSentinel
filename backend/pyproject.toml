[project]
name = "netsentinel-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1", "alembic>=1.13,<2", "pydantic-settings>=2.5,<3",
  "pyjwt[crypto]>=2.9,<3", "pwdlib[argon2]>=0.2,<1", "redis>=5,<6",
  "python-multipart>=0.0.12,<1", "structlog>=24,<26"
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "httpx>=0.27,<1", "ruff>=0.7,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
