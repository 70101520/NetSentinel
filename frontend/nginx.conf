server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 2m;
  location /api/ { proxy_pass http://api:8000; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Request-ID $request_id; }
  location /health/ { proxy_pass http://api:8000; }
  location / { try_files $uri /index.html; }
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; style-src 'self'; script-src 'self'" always;
}
