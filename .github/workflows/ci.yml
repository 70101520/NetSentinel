name: validation
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.test -t netsentinel-test .
      - run: docker run --rm netsentinel-test ruff check --select E9,F63,F7,F82 app tests
      - run: docker run --rm netsentinel-test pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
