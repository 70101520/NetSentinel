name: validation
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_DB: test, POSTGRES_USER: test, POSTGRES_PASSWORD: test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d test" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.test -t netsentinel-test .
      - run: docker run --rm netsentinel-test ruff check --select E9,F63,F7,F82 app tests
      - run: docker run --rm --network host -e DATABASE_URL=postgresql+asyncpg://test:test@localhost/test -e REDIS_URL=redis://localhost:6379/15 -e JWT_SECRET=test-secret-that-is-at-least-thirty-two-characters -e SERVICE_TOKEN_PEPPER=test-pepper-that-is-at-least-thirty-two-characters netsentinel-test sh -c 'alembic upgrade head && pytest -q'
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
  windows-agent:
    runs-on: windows-latest
    defaults: {run: {working-directory: agent/windows}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - run: dotnet restore NetSentinel.Agent.sln
      - run: dotnet build NetSentinel.Agent.sln -c Release --no-restore
      - run: dotnet test NetSentinel.Agent.sln -c Release --no-build
      - run: dotnet publish NetSentinel.Agent/NetSentinel.Agent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true
