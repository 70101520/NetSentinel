name: validation
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_DB: test, POSTGRES_USER: test, POSTGRES_PASSWORD: test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d test" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.test -t netsentinel-test .
      - run: docker run --rm netsentinel-test ruff check --select E9,F63,F7,F82 app tests
      - run: docker run --rm --network host -e DATABASE_URL=postgresql+asyncpg://test:test@localhost/test -e REDIS_URL=redis://localhost:6379/15 -e JWT_SECRET=test-secret-that-is-at-least-thirty-two-characters -e SERVICE_TOKEN_PEPPER=test-pepper-that-is-at-least-thirty-two-characters netsentinel-test sh -c 'alembic upgrade head && pytest -q'
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
  windows-agent:
    runs-on: windows-latest
    defaults: {run: {working-directory: agent/windows}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - run: dotnet restore NetSentinel.Agent.sln
      - run: dotnet build NetSentinel.Agent.sln -c Release --no-restore
      - run: dotnet test NetSentinel.Agent.sln -c Release --no-build
      - run: dotnet publish NetSentinel.Agent/NetSentinel.Agent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true
      - name: Import optional internal lab signing certificate
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.NETSENTINEL_LAB_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.NETSENTINEL_LAB_SIGNING_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64) -xor [string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)) {
            throw 'Both NetSentinel lab signing secrets must be configured together.'
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) {
            'NETSENTINEL_SIGNING_ENABLED=false' | Add-Content $env:GITHUB_ENV
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'netsentinel-signing.pfx'
          [IO.File]::WriteAllBytes($pfx,[Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          $password = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password -Exportable:$false
          if (-not $certificate) { throw 'The lab signing certificate could not be imported.' }
          "NETSENTINEL_SIGNING_THUMBPRINT=$($certificate.Thumbprint)" | Add-Content $env:GITHUB_ENV
          'NETSENTINEL_SIGNING_ENABLED=true' | Add-Content $env:GITHUB_ENV
          New-Item -ItemType Directory -Force installer-output | Out-Null
          $publicCertificate = 'installer-output\NetSentinel-Lab-Code-Signing.cer'
          Export-Certificate -Cert $certificate -FilePath $publicCertificate -Type CERT | Out-Null
          Import-Certificate -FilePath $publicCertificate -CertStoreLocation Cert:\CurrentUser\Root | Out-Null
          Import-Certificate -FilePath $publicCertificate -CertStoreLocation Cert:\CurrentUser\TrustedPublisher | Out-Null
      - name: Sign published Agent executable
        if: env.NETSENTINEL_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: ./signing/Sign-NetSentinelWindowsArtifact.ps1 -CertificateThumbprint $env:NETSENTINEL_SIGNING_THUMBPRINT -Path ./NetSentinel.Agent/bin/Release/net8.0-windows/win-x64/publish/NetSentinel.Agent.exe
      - run: choco install innosetup --no-progress -y
      - run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'
      - name: Sign and verify installer
        if: env.NETSENTINEL_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: ./signing/Sign-NetSentinelWindowsArtifact.ps1 -CertificateThumbprint $env:NETSENTINEL_SIGNING_THUMBPRINT -Path (Get-ChildItem ./installer-output/NetSentinel-Agent-Setup-*.exe | Select-Object -ExpandProperty FullName)
      - name: Publish installer checksum
        shell: pwsh
        run: |
          $setup = Get-ChildItem ./installer-output/NetSentinel-Agent-Setup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToLowerInvariant()
          "$hash  $($setup.Name)" | Set-Content ./installer-output/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: NetSentinel-Agent-win-x64
          path: agent/windows/NetSentinel.Agent/bin/Release/net8.0-windows/win-x64/publish/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: NetSentinel-Agent-Setup-win-x64
          path: |
            agent/windows/installer-output/NetSentinel-Agent-Setup-*.exe
            agent/windows/installer-output/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload internal lab trust certificate
        if: env.NETSENTINEL_SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NetSentinel-Lab-Trust-Certificate
          path: agent/windows/installer-output/NetSentinel-Lab-Code-Signing.cer
          if-no-files-found: error
      - name: Remove signing material from runner
        if: always() && env.NETSENTINEL_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          Remove-Item (Join-Path $env:RUNNER_TEMP 'netsentinel-signing.pfx') -Force -ErrorAction SilentlyContinue
          if ($env:NETSENTINEL_SIGNING_THUMBPRINT) {
            Remove-Item "Cert:\CurrentUser\My\$env:NETSENTINEL_SIGNING_THUMBPRINT" -Force -ErrorAction SilentlyContinue
            Remove-Item "Cert:\CurrentUser\Root\$env:NETSENTINEL_SIGNING_THUMBPRINT" -Force -ErrorAction SilentlyContinue
            Remove-Item "Cert:\CurrentUser\TrustedPublisher\$env:NETSENTINEL_SIGNING_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          }
