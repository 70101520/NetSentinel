name: validation
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: >-
          pip install
          'fastapi>=0.115,<1' 'sqlalchemy[asyncio]>=2.0,<3' 'asyncpg>=0.29,<1'
          'alembic>=1.13,<2' 'pydantic-settings>=2.5,<3' 'pyjwt[crypto]>=2.9,<3'
          'pwdlib[argon2]>=0.2,<1' 'redis>=5,<6' 'python-multipart>=0.0.12,<1'
          'structlog>=24,<26' 'pytest>=8,<9' 'pytest-asyncio>=0.24,<1'
          'httpx>=0.27,<1' 'ruff>=0.7,<1'
      - run: ruff check --select E9,F63,F7,F82 app tests
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
